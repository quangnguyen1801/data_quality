[workspace]
members=[
    "model",
    "repository",
    "service",
    "execute_testcase"
]

[workspace.dependencies]
chrono = {version="0.4.41", features=["serde"]}
serde = {version="1.0.219", features=["derive"]}
serde_json = "1.0.143"
tiberius = {version = "0.12.3", features=["all"]}
tiberius-mappers = "0.7.0"
once_cell = "1.21.3"
anyhow = "1.0.99"
async-std = {version = "1.13.1", features=["attributes"]}
async-trait = "0.1.89"
sqlx = {version="0.8.6", features=["runtime-async-std-native-tls", "postgres", "chrono"] }
calamine = "0.30.0"
futures = "0.3.31"
csv-async = "1.3.1"
polars = {version = "0.51.0", features=["lazy", "strings"]}
strum = "0.27.2"
strum_macros = "0.27.2"
tokio = {version = "1.47.1", features=["full"]}